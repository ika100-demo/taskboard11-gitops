apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: taskboard11-backups
  labels:
    app.kubernetes.io/name: backups
    app.kubernetes.io/part-of: taskboard11
    app.kubernetes.io/managed-by: gitops-app
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  name: taskboard11-backups
  clusterRef:
    name: taskboard11-backups
  reclaimPolicy: Retain
  versioning: Suspended
  owner: taskboard11-backups
  access:
  - user: taskboard11-backups
    actions:
    - Read
    - Write
    - List
    - Tagging
  adoptExisting: true

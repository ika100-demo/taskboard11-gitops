apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard11-api
  labels:
    app: taskboard11-api
    app.kubernetes.io/name: taskboard11-api
    app.kubernetes.io/part-of: taskboard11
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard11-api.taskboard11-prod.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard11-api
      port: 80

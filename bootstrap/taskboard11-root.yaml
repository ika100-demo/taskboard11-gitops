apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard11-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ika100-demo/taskboard11-gitops
    targetRevision: main
    path: applications/taskboard11
    directory:
      include: applicationset.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
